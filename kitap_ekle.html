<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Kitap Ekle — Kitap Kulübü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">
                <i class="fa-solid fa-book-open-reader text-warning me-2"></i>Kitap Kulübü
            </a>
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i>Ana Sayfa</a>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h3 class="fw-bold text-dark mb-4 text-center">
                <i class="fa-solid fa-plus-circle text-success me-2"></i>Yeni Kitap & Özet Ekle
            </h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Kitap Adı</label>
                    <input type="text" name="baslik" class="form-control rounded-3" placeholder="Örn: 1984" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Yazar</label>
                    <input type="text" name="yazar" class="form-control rounded-3" placeholder="Örn: George Orwell" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Kategori / Tür</label>
                    <select name="kategori" class="form-select rounded-3">
                        <option value="roman">Roman</option>
                        <option value="bilim-kurgu">Bilim Kurgu</option>
                        <option value="klasik">Dünya Klasikleri</option>
                        <option value="felsefe">Felsefe & Psikoloji</option>
                        <option value="tarih">Tarih & Biyografi</option>
                        <option value="kisisel-gelisim">Kişisel Gelişim</option>
                        <option value="diger">Diğer</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Kitap Özeti / İnceleme</label>
                    <textarea name="ozet" class="form-control rounded-3" rows="5" placeholder="Kitap hakkında detaylı özet veya düşüncelerinizi yazın..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted">Kapak Resmi <small class="fw-normal">(İsteğe Bağlı - Boş bırakılırsa otomatik renkli CSS kapak oluşturulur)</small></label>
                    <input type="file" name="kapak_resmi" class="form-control rounded-3">
                </div>

                <button type="submit" class="btn btn-success fw-bold w-100 rounded-pill py-2">
                    <i class="fa-solid fa-check me-1"></i> Kitabı Kaydet
                </button>
            </form>
        </div>
    </div>

</body>
</html>
