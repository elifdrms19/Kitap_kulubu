<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Kitap Kulübü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow p-4 border-0 rounded-4">
            <h3 class="card-title text-center mb-4 fw-bold">
                <i class="fa-solid fa-right-to-bracket text-success me-2"></i>Giriş Yap
            </h3>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3 rounded-pill fw-bold">Giriş Yap</button>
            </form>

            <!-- Şifremi Unuttum Bağlantısı -->
            <div class="text-end mt-3">
                <a href="{% url 'password_reset' %}" class="text-muted small text-decoration-none">
                    <i class="fa-solid fa-key me-1"></i>Şifrenizi mi unuttunuz?
                </a>
            </div>

            <hr class="my-4">

            <p class="text-center mb-0 small">
                Hesabın yok mu? <a href="{% url 'kayit' %}" class="fw-bold text-decoration-none">Kayıt Ol</a>
            </p>
        </div>
    </div>
</body>
</html>
