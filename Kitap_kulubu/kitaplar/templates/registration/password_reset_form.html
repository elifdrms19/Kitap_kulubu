</html><!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifremi Unuttum - Kitap Kulübü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow p-4 border-0 rounded-4">
            <h3 class="card-title text-center mb-3 fw-bold">
                <i class="fa-solid fa-key text-warning me-2"></i>Şifremi Unuttum
            </h3>
            <p class="text-muted small text-center mb-4">
                Hesabınıza bağlı e-posta adresinizi girin, size şifre sıfırlama bağlantısını gönderelim.
            </p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill">
                    Sıfırlama Bağlantısı Gönder
                </button>
            </form>
            <hr class="my-4">
            <p class="text-center mb-0 small">
                <a href="{% url 'login' %}" class="text-decoration-none">← Giriş Sayfasına Dön</a>
            </p>
        </div>
    </div>
</body>
</html>
