<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Kitap Kulübü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow p-4">
            <h3 class="card-title text-center mb-4">Aramıza Katıl 📚</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Kayıt Ol</button>
            </form>
            <hr>
            <p class="text-center mb-0">Zaten hesabın var mı? <a href="{% url 'login' %}">Giriş Yap</a></p>
        </div>
    </div>
</body>
</html>
